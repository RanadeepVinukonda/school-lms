<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School LMS — Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 4rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.5rem;
    }
    .status { color: #667eea; font-weight: 600; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
    }
    .eta {
      display: inline-block;
      background: #f1f5f9;
      border-radius: 2rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.875rem;
      color: #475569;
      font-weight: 500;
      margin-bottom: 2rem;
    }
    .footer { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🔧</span>
    <div class="status">Service Unavailable</div>
    <h1>Under Maintenance</h1>
    <p>We're performing scheduled upgrades to serve you better. The platform will be back shortly.</p>
    <div class="eta">⏱ Expected downtime: &lt; 30 minutes</div>
    <p class="footer">If you need urgent assistance, please contact support</p>
  </div>
</body>
</html>
