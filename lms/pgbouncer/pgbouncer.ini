[databases]
school_lms = host=postgres port=5432 dbname=school_lms pool_size=25 max_db_connections=50

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_user = lms
pool_mode = transaction
max_client_conn = 100
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 50
max_user_connections = 50
server_idle_timeout = 300
client_idle_timeout = 600
query_timeout = 30
idle_transaction_timeout = 60
stats_period = 60
log_connections = 0
log_disconnections = 0
