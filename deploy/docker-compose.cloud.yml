# ===================================================================
# Genesis LMS — Backend + Redis, production cloud docker-compose
#
# HOW TO USE:
#   1. Copy backend.env.template near your repo and fill in values
#      (or reuse lms/backend/.env). *.env files are NOT committed.
#   2. Put this file at the repo root (next to lms/) so the build
#      contexts below resolve, then:
#        docker compose -f docker-compose.cloud.yml up -d --build
#   3. Point Nginx (nginx-backend.conf) at backend on 127.0.0.1:4000.
#
# Frontend is deliberately NOT here — it stays on Vercel. See
# docs/CLOUD_DEPLOY_GUIDE.md for the vercel.json rewrite wiring.
# ===================================================================

services:
  backend:
    build:
      context: ./lms/backend
      dockerfile: Dockerfile
    image: genesis-backend:latest
    env_file:
      - ./lms/backend/.env            # your filled production env (backend.env.template)
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CRON_SECRET=${CRON_SECRET:?Set CRON_SECRET in .env}
      - VERCEL=0                      # keep file logging on the real server
    ports:
      - "127.0.0.1:4000:4000"         # loopback only — Nginx is the public gate
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s               # transformers+tesseract warm-up on first boot
    deploy:
      resources:
        limits:
          memory: 2G                  # pdf-parse + transformers + OCR are heavy
          cpus: '2.0'
    stop_grace_period: 30s            # graceful shutdown (PG pool + scheduler drain)
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  # Optional — app does NOT read Redis yet. Enable when you add the
  # redis helper (docs/CLOUD_DEPLOY_GUIDE.md §8). Uncomment to run it.
