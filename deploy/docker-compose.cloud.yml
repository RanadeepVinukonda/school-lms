# ===================================================================
# Genesis LMS — Backend, production cloud docker-compose
#
# Supports: versioned images, multiple replicas, Nginx load balancing
#
# HOW TO USE:
#   1. Fill in .env file (see SERVER_DEPLOYMENT.md)
#   2. Set IMAGE_VERSION in .env or export it:
#        export IMAGE_VERSION=v1.0.0
#   3. Start:
#        docker compose -f docker-compose.cloud.yml up -d
#   4. Scale replicas:
#        docker compose -f docker-compose.cloud.yml up -d --scale backend=3
#
# Frontend stays on Vercel. Database stays on Supabase.
# ===================================================================

services:
  backend:
    image: ranadeepvinukonda/genesis-backend:${IMAGE_VERSION:-latest}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CRON_SECRET=${CRON_SECRET:?Set CRON_SECRET in .env}
      - VERCEL=0
    expose:
      - "4000"                            # internal only — Nginx on host talks via Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    stop_grace_period: 30s
    networks:
      - genesis
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

networks:
  genesis:
    driver: bridge
