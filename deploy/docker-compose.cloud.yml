# ===================================================================
# Genesis LMS — Backend + Nginx, production cloud docker-compose
#
# Everything runs in Docker. One command to start:
#   docker compose -f docker-compose.cloud.yml up -d
#
# HOW TO USE:
#   1. Fill in .env file (see SERVER_DEPLOYMENT.md)
#   2. Set IMAGE_VERSION in .env or export it:
#        export IMAGE_VERSION=v1.0.0
#   3. Start:
#        docker compose -f docker-compose.cloud.yml up -d
#   4. Get SSL (first time only, after DNS is pointing here):
#        docker compose -f docker-compose.cloud.yml run --rm certbot
#   5. Scale replicas:
#        docker compose -f docker-compose.cloud.yml up -d --scale backend=3
#
# Frontend stays on Vercel. Database stays on Supabase.
# ===================================================================

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - genesis
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - certonly
    networks:
      - genesis

  backend:
    image: ranadeep8919/genesis-backend:${IMAGE_VERSION:-latest}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CRON_SECRET=${CRON_SECRET:?Set CRON_SECRET in .env}
      - VERCEL=0
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    stop_grace_period: 30s
    networks:
      - genesis
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

networks:
  genesis:
    driver: bridge
