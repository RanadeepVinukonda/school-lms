# ===================================================================
# Genesis LMS — Nginx reverse proxy + load balancer (runs in Docker)
#
# Load balances across all backend replicas via Docker DNS.
# SSL certs are mounted from the host's /etc/letsencrypt.
#
# SETUP (first time):
#   1. Point DNS: api.YOURDOMAIN.com → server IP
#   2. Get cert:  docker compose -f docker-compose.cloud.yml run --rm certbot certonly --webroot -w /var/www/certbot -d api.YOURDOMAIN.com --agree-tos -m you@email.com
#   3. Start:     docker compose -f docker-compose.cloud.yml up -d
#
# RENEWAL: Automatic via certbot service (runs every 12h).
#
# Replace YOURDOMAIN.com below with your actual domain.
# ===================================================================

# Docker DNS resolver (finds all replicas of "backend" service)
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=apimin:10m rate=30r/s;

# HTTP → HTTPS redirect + ACME challenge for certbot
server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + Backend load balancer
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOURDOMAIN.com;

    ssl_certificate     /etc/letsencrypt/live/api.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOURDOMAIN.com/privkey.pem;

    # ---- Security headers ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0" always;

    # ---- Backend load balancer ----
    location /api/ {
        limit_req zone=apimin burst=50 nodelay;

        set $upstream http://backend:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        client_max_body_size  55m;

        proxy_buffering off;
    }

    # Health probe
    location = /health {
        set $upstream http://backend:4000;
        proxy_pass $upstream/health;
        proxy_set_header Host $host;
    }

    # Everything else → 404
    location / {
        return 404;
    }
}
