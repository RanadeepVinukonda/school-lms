# ===================================================================
# Genesis LMS — Nginx reverse proxy for the BACKEND on the cloud server
# Frontend stays on Vercel. This terminates TLS and proxies /api and
# /api/inngest to the backend container on 127.0.0.1:4000.
#
# INSTALL:
#   sudo cp nginx-backend.conf /etc/nginx/sites-available/genesis-backend
#   sudo ln -s /etc/nginx/sites-available/genesis-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.YOURDOMAIN.com
#
# Replace YOURDOMAIN.com and the two <...> placeholders below.
# ===================================================================

# ---- Rate-limit zones (define once at http{} level normally, but a
#      standalone vhost works too with Nginx >= 1.25) ----------------
limit_req_zone $binary_remote_addr zone=apimin:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;

    # Redirect everything to HTTPS (certbot rewrites this to 443).
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOURDOMAIN.com;

    # Certbot will fill in the ssl_certificate lines on first run.
    # ssl_certificate     /etc/letsencrypt/live/api.YOURDOMAIN.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.YOURDOMAIN.com/privkey.pem;

    # ---- Security headers ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0" always;

    # ---- Backend upstream (Docker on loopback) ----
    location /api/ {
        limit_req zone=apimin burst=50 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Long-running endpoints:
        #  - /api/inngest  textbook pipeline (Inngest Cloud polls this)
        #  - /api/ocr/*    scans allow up to 180-240s server-side
        #  - /api/ai/*     AI generation
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        client_max_body_size  55m;      # textbook PDFs up to 50MB + multipart overhead

        # Stream responses (SSE not used today, harmless to keep).
        proxy_buffering off;
    }

    # Health probes (used by Docker HEALTHCHECK + uptime monitors).
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    # Everything else → 404 (no static content served from the API host).
    location / {
        return 404;
    }
}
