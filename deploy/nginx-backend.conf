# ===================================================================
# Genesis LMS — Nginx reverse proxy + load balancer for the backend
#
# Load balances across all Docker replicas automatically.
# Docker Compose scales the "backend" service, Nginx discovers them
# via Docker's internal DNS resolver (127.0.0.11).
#
# INSTALL:
#   sudo cp nginx-backend.conf /etc/nginx/sites-available/genesis-backend
#   sudo ln -s /etc/nginx/sites-available/genesis-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.YOURDOMAIN.com
#
# Replace YOURDOMAIN.com below.
# ===================================================================

# Docker Compose network resolver (for replica discovery)
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=apimin:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOURDOMAIN.com;

    # Certbot fills ssl_certificate on first run.
    # ssl_certificate     /etc/letsencrypt/live/api.YOURDOMAIN.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.YOURDOMAIN.com/privkey.pem;

    # ---- Security headers ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0" always;

    # ---- Backend load balancer ----
    # Docker's DNS resolver finds all replicas of the "backend" service.
    # least_conn sends each new request to the replica with fewest active connections.
    # set $upstream lets Nginx re-resolve DNS on each request (picks up new/removed replicas).
    location /api/ {
        limit_req zone=apimin burst=50 nodelay;

        set $upstream http://backend:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        client_max_body_size  55m;

        proxy_buffering off;
    }

    # Health probe
    location = /health {
        set $upstream http://backend:4000;
        proxy_pass $upstream/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
