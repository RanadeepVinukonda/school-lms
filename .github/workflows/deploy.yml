name: CI + Deploy

on:
  push:
    branches: [main]
    paths:
      - 'lms/backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lms/backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  ci:
    name: Lint + TypeCheck + Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: lms/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms/backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lms_test
          JWT_SECRET: test-secret
          SUPABASE_URL: http://localhost
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test

  docker-hub:
    name: Build + Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set image version
        id: version
        run: echo "tag=v1.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./lms/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/genesis-backend:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/genesis-backend:latest

  render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [ci, docker-hub]
    if: github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for Render health
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL || 'https://school-lms-api-b8cn.onrender.com/health' }}
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "Healthy after $((attempt * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Render health check failed after 10 minutes"
          exit 1

  cloud-server:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    needs: docker-hub
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set image version
        id: version
        run: echo "tag=v1.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check cloud server secrets
        id: cloud
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_IP" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloud server SSH secrets are not configured; skipping deploy."
          fi

      - name: Deploy via SSH
        if: steps.cloud.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/genesis-lms
            sed -i "s/^IMAGE_VERSION=.*/IMAGE_VERSION=${{ steps.version.outputs.tag }}/" .env
            docker compose -f docker-compose.cloud.yml pull
            docker compose -f docker-compose.cloud.yml up -d
            sleep 5
            curl -sf http://localhost/health || echo "HEALTH CHECK FAILED"
