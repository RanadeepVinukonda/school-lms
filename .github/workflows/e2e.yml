name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Playwright Web E2E
    runs-on: ubuntu-latest
    continue-on-error: true  # App needs to be deployed for these to pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        working-directory: lms/frontend
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: lms/frontend
        run: npx playwright install --with-deps
      - name: Start Dev Server
        working-directory: lms/frontend
        run: |
          npx vite --port 5173 --host &
          echo 'Waiting for dev server...'
          for i in $(seq 1 10); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && echo 'Server ready!' && break
            sleep 2
          done
      - name: Run E2E Tests
        working-directory: lms/frontend
        run: npx playwright test --pass-with-no-tests
