name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    defaults:
      run:
        working-directory: lms/backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
  frontend:
    defaults:
      run:
        working-directory: lms/frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Install Lighthouse CI CLI
        run: npm install -g @lhci/cli@0.13.x
      - name: Run Web Vitals budget check
        run: npx ts-node ../scripts/check-web-vitals.ts 45 0.02 1200
