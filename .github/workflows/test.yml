name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint frontend
        working-directory: lms/frontend
        run: npm ci && npm run lint
      - name: Lint backend
        working-directory: lms/backend
        run: npm ci && npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Typecheck frontend
        working-directory: lms/frontend
        run: npm ci && npx tsc --noEmit
      - name: Typecheck backend
        working-directory: lms/backend
        run: npm ci && npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test frontend
        working-directory: lms/frontend
        run: npm ci && npm test
      - name: Test backend
        working-directory: lms/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lms_test
          JWT_SECRET: test-secret
          SUPABASE_URL: http://localhost
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
        run: npm ci && npm test
