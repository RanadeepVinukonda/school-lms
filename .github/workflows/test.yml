name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (backend)
        run: npm audit --audit-level=high
        working-directory: lms/backend
        continue-on-error: true
      - name: npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: lms/frontend
        continue-on-error: true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx drizzle-kit generate --config drizzle.config.ts 2>/dev/null; git diff --exit-code supabase/migrations/ || (echo '⚠️  Migration out of sync — run npm run db:generate'; exit 1)
      - run: npm test



  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
