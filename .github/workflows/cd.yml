name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: git sha)'
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

jobs:
  backend-build:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: lms/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write frontend .env from secret
        run: echo "${{ secrets.FRONTEND_ENV }}" | base64 -d > lms/frontend/.env

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: lms/frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ secrets.DOMAIN || 'school-lms.local' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare deploy package
        run: |
          mkdir -p /tmp/deploy
          echo "${{ secrets.BACKEND_ENV }}" | base64 -d > /tmp/deploy/backend.env
          cat > /tmp/deploy/docker-compose.yml << EOF
          services:
            backend:
              image: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
              ports:
                - "4000:4000"
              env_file: ./backend.env
              environment:
                - NODE_ENV=production
                - PORT=4000
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 15s
            frontend:
              image: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
              ports:
                - "80:80"
              depends_on:
                - backend
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 10s
          EOF

      - name: Copy files to VPS
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /opt/school-lms"
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            /tmp/deploy/* \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/school-lms/

      - name: Pull images & restart containers
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          # Unquoted heredoc so GHCR_PAT expands locally before sending to SSH
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << DEPLOY_END
            set -e
            cd /opt/school-lms

            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            sleep 15

            ok=false
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
                echo "✓ Backend health check passed"
                ok=true
                break
              fi
              echo "Attempt \$i/5 — not ready, waiting 5s..."
              sleep 5
            done

            if [ "$ok" != "true" ]; then
              echo "✗ Health check failed"
              docker compose logs --tail=50 backend
              exit 1
            fi

            if curl -sf http://localhost:80 > /dev/null 2>&1; then
              echo "✓ Frontend is serving"
            else
              echo "⚠ Frontend not responding"
              docker compose logs --tail=20 frontend
            fi

            docker image prune -af --filter "until=24h" 2>/dev/null || true
            echo "✓ Deploy complete"
          DEPLOY_END

  notify:
    name: Notify
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✓ Deploy to ${{ secrets.DOMAIN || 'VPS' }} succeeded"
          else
            echo "✗ Deploy failed — check workflow logs"
            exit 1
          fi
