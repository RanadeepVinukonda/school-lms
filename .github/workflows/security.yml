name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gitleaks scan is defined in test.yml — duplicated here to prevent conflicts
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL || 'https://staging.school-lms.com' }}
          rules_file_name: .github/zap.conf
          allow_issue_writing: false
          fail_action: false
